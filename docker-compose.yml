services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PRICING_PARAMS_PATH: /app/config/pricing_params.yaml
      INTERNAL_API_TOKEN: local-dev-token
      LOG_LEVEL: INFO
      CORS_ALLOWED_ORIGINS: "*"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

