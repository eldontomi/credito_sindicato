services:
  - type: web
    name: credito-sindicato-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PRICING_PARAMS_PATH
        value: /app/config/pricing_params.yaml
      - key: CORS_ALLOWED_ORIGINS
        value: https://jabuticaba.ai
      - key: INTERNAL_API_TOKEN
        generateValue: true
